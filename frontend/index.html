<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CISSP試験対策のための共有学習ノートアプリ" />
    <title>Octant</title>
    <script>
      // 描画前にテーマを確定させ、初回表示のちらつきを防ぎます。
      // 保存済みの設定がなければ OS の prefers-color-scheme に従います。
      (function () {
        try {
          var stored = localStorage.getItem('octant-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage が使えない環境では既定のライトテーマで表示します */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
