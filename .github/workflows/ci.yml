# PR の静的解析とテスト。
#
# API First を機械的に強制するため、lint より前に make gen の差分を検証する。
name: CI

on:
  pull_request:
    branches:
      - develop
      - main

# 読み取り以外の権限は与えない。デプロイは TICKET-005 の別ワークフローが担う。
permissions:
  contents: read

# 同じ PR に続けて push した場合、古い実行は打ち切る（無駄な実行時間を使わない）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  lint-and-test:
    name: lint と test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: チェックアウト
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Go をセットアップ
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # モジュールとビルドキャッシュを go.sum の内容で紐付ける。
          cache-dependency-path: backend/go.sum

      - name: Node をセットアップ
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # golangci-lint は go install に時間がかかるため、バージョンをキーにして
      # GOPATH/bin ごとキャッシュする。Makefile がバージョンを固定しているので
      # Makefile のハッシュが変わったときだけ入れ直せばよい。
      #
      # **このキャッシュはデプロイのワークフローと共有しない。**
      # deploy.yml 側はキャッシュを使わない設定にしてある（PR で汚染された
      # 実行ファイルが、デプロイ権限を持つジョブで動く経路を作らないため）。
      - name: Go ツールのキャッシュを復元
        id: cache-go-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('Makefile') }}

      - name: Go ツールを導入（golangci-lint / oapi-codegen）
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: make setup-tools

      - name: 依存を取得
        run: |
          make setup-back
          make setup-front

      # openapi.yaml を直したのに make gen を忘れた PR をここで落とす。
      # 生成物と仕様がずれると「型は通るが実挙動と契約が食い違う」状態になるため、
      # lint やテストより前に検証する。
      - name: make gen の差分検証（API First）
        run: make gen-check

      - name: lint（golangci-lint / eslint / tsc --noEmit）
        run: make lint

      - name: backend のテスト
        run: make test

      # 認証ミドルウェアはこのプロジェクトの防壁そのものなので、
      # エミュレータを立てて実挙動を毎 PR で検証する。
      # 現在は Auth エミュレータだけを使うため Java は不要。
      # Firestore エミュレータを足す際（TICKET-006）は JRE のセットアップが要る。
      - name: firebase-tools を導入
        run: npm install -g firebase-tools@15

      - name: backend の統合テスト（Auth エミュレータ）
        run: make test-integration

      - name: frontend のテスト
        run: make test-front
